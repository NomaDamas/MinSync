[package]
name = "minsync"
version = "0.7.3"
edition = "2021"
rust-version = "1.94"
description = "Manifest-based incremental vector DB indexing CLI for text files"
license = "MIT"
repository = "https://github.com/NomaDamas/MinSync"
readme = "README.md"
keywords = ["vector-database", "embeddings", "semantic-search", "indexing", "rag"]
categories = ["command-line-utilities", "text-processing"]
exclude = [
    ".github/",
    ".idea/",
    "AGENTS.md",
    "bindings/",
    "CLAUDE.md",
    "runs/",
    "evidence/",
    "prompts/",
    "scripts/",
    "tests/",
]

[workspace]
members = [".", "bindings/node"]

[dependencies]
chunk = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ignore = "0.4"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
async-trait = "0.1"
fs2 = "0.4"
lancedb = "0.31"
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
futures = "0.3"
notify-debouncer-full = { version = "0.8.0-rc.2", features = ["tokio"] }
libc = "0.2"
parking_lot = "0.12"
# All model inference lives in im-not-llm; MinSync only adapts its engines.
inl-core = "0.1.1"
inl-text = "0.1.0"
inl-sparse = "0.1.2"
inl-server = { version = "0.3.1", default-features = false }
# Apple Neural Engine engines (Core ML, macOS only; the package table and
# layout code build everywhere): the default for the SPLADE encoder on Apple
# silicon, opt-in (`device = "ane"`) for the dense embedders.
inl-ane = "0.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
# `accelerate` routes CPU matmuls to Accelerate.framework (always present on
# macOS); without it candle's pure-Rust gemm runs SPLADE ~40x slower than Metal.
inl-core = { version = "0.1.1", features = ["accelerate"] }

# Opt-in native backends for non-macOS builds; macOS gets Metal + Accelerate.
# `--features mkl`: Intel MKL BLAS for x86_64 CPU encoders.
# `--features cuda`: NVIDIA GPU (needs the CUDA toolkit at build time).
[features]
default = []
mkl = ["inl-core/mkl", "inl-text/mkl", "inl-sparse/mkl", "inl-server/mkl"]
cuda = ["inl-core/cuda", "inl-text/cuda", "inl-sparse/cuda", "inl-server/cuda"]

[target.'cfg(not(windows))'.build-dependencies]
protobuf-src = "2.1"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }
