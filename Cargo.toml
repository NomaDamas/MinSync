[package]
name = "minsync"
version = "0.7.3"
edition = "2021"
rust-version = "1.91"
description = "Manifest-based incremental vector DB indexing CLI for text files"
license = "MIT"
repository = "https://github.com/NomaDamas/MinSync"
readme = "README.md"
keywords = ["vector-database", "embeddings", "semantic-search", "indexing", "rag"]
categories = ["command-line-utilities", "text-processing"]
exclude = [
    ".github/",
    ".idea/",
    "AGENTS.md",
    "bindings/",
    "CLAUDE.md",
    "runs/",
    "evidence/",
    "prompts/",
    "scripts/",
    "tests/",
]

[workspace]
members = [".", "bindings/node"]

[features]
default = []
# Forwarded to the im-not-llm engine crates; see their manifests for what each
# one enables (NVIDIA GPUs, Apple Accelerate, Intel MKL).
cuda = ["inl-core/cuda", "inl-text/cuda", "inl-sparse/cuda", "inl-server/cuda"]
accelerate = [
    "inl-core/accelerate",
    "inl-text/accelerate",
    "inl-sparse/accelerate",
    "inl-server/accelerate",
]
mkl = ["inl-core/mkl", "inl-text/mkl", "inl-sparse/mkl", "inl-server/mkl"]

[dependencies]
chunk = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ignore = "0.4"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
async-trait = "0.1"
fs2 = "0.4"
lancedb = "0.31"
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
futures = "0.3"
notify-debouncer-full = { version = "0.8.0-rc.2", features = ["tokio"] }
libc = "0.2"
parking_lot = "0.12"

# Model runtimes (candle text/sparse engines and the loopback daemon) live in
# im-not-llm; MinSync is the text-only indexer that drives them.
inl-core = { git = "https://github.com/NomaDamas/im-not-llm", rev = "55acc36" }
inl-text = { git = "https://github.com/NomaDamas/im-not-llm", rev = "55acc36" }
inl-sparse = { git = "https://github.com/NomaDamas/im-not-llm", rev = "55acc36" }
inl-server = { git = "https://github.com/NomaDamas/im-not-llm", rev = "55acc36", default-features = false }

# candle-core 0.11.0 does not compile on rustc 1.93 aarch64: neon.rs uses
# float16x8_t which now requires the unstable stdarch_neon_f16 feature.
# huggingface/candle#3845 gates those types behind target_feature="fp16".
[patch.crates-io]
candle-core = { git = "https://github.com/huggingface/candle", rev = "7b59bb97817beb527a1afcf9c11cd4aff1898bc2" }
candle-nn = { git = "https://github.com/huggingface/candle", rev = "7b59bb97817beb527a1afcf9c11cd4aff1898bc2" }
candle-metal-kernels = { git = "https://github.com/huggingface/candle", rev = "7b59bb97817beb527a1afcf9c11cd4aff1898bc2" }

[target.'cfg(not(windows))'.build-dependencies]
protobuf-src = "2.1"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }
