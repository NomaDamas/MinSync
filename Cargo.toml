[package]
name = "minsync"
version = "0.4.0"
edition = "2021"
rust-version = "1.91"
description = "Manifest-based incremental vector DB indexing CLI for text files"
license = "MIT"
repository = "https://github.com/NomaDamas/MinSync"
readme = "README.md"
keywords = ["vector-database", "embeddings", "semantic-search", "indexing", "rag"]
categories = ["command-line-utilities", "text-processing"]
exclude = [
    ".github/",
    ".idea/",
    "AGENTS.md",
    "CLAUDE.md",
    "runs/",
    "evidence/",
    "prompts/",
    "scripts/",
    "tests/",
]

[dependencies]
chunk = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ignore = "0.4"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
async-trait = "0.1"
fs2 = "0.4"
lancedb = "0.30"
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
futures = "0.3"
notify-debouncer-full = { version = "0.8.0-rc.2", features = ["tokio"] }
lzma-sys = { version = "0.1", features = ["static"] }
jieba-rs = "0.9.0"
kiwi-rs = { package = "kiwi-rs-fixed", version = "2026.7.24" }
lindera = { version = "3.0.7", features = ["embed-ipadic"] }

[target.'cfg(not(windows))'.build-dependencies]
protobuf-src = "2.1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }
