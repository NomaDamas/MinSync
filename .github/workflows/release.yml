name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          targets: ${{ matrix.target }}

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test Windows CLI contract
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/minsync.exe"
          $help = & $exe --help 2>&1
          if ($LASTEXITCODE -ne 0 -or $help -notmatch "Usage:") { throw "top-level help failed" }
          $init = & $exe init --language simple --help 2>&1
          if ($LASTEXITCODE -ne 0 -or $init -notmatch "--language") { throw "init language flag failed" }
          foreach ($mode in @("vector", "bm25", "hybrid")) {
            $query = & $exe query alpha --mode $mode --help 2>&1
            if ($LASTEXITCODE -ne 0 -or $query -notmatch "--mode") { throw "query mode $mode failed" }
          }
          $invalid = & $exe query alpha --mode nope 2>&1
          if ($LASTEXITCODE -ne 2 -or $invalid -notmatch "possible values") {
            throw "invalid query mode was not rejected as expected"
          }
          $output = & $exe watch --watch-on-sync-error --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "Windows watch flag was rejected: $output"
          }
          if ($output -notmatch "--watch-on-sync-error") {
            throw "Windows watch help omitted --watch-on-sync-error: $output"
          }

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf minsync-${{ github.ref_name }}-${{ matrix.target }}.tar.gz minsync
          mv minsync-${{ github.ref_name }}-${{ matrix.target }}.tar.gz "$GITHUB_WORKSPACE"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/minsync.exe -DestinationPath minsync-${{ github.ref_name }}-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: minsync-${{ matrix.target }}
          path: minsync-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-crate:
    name: publish to crates.io
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
