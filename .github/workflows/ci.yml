name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Kiwi
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/install-kiwi.sh >> "$GITHUB_ENV"

      - name: Install Kiwi
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KIWI_VERSION: 0.22.2
        run: |
          scripts/install-kiwi.ps1 | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cargo test -- --test-threads=1
          else
            cargo test
          fi
      - run: cargo build --release
